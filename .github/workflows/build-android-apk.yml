name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Dulce Victoria APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DulceVictoria-Agenda.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DulceVictoria-Agenda-APK
          path: DulceVictoria-Agenda.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-latest
          name: Dulce Victoria — App Android (APK)
          body: |
            APK instalable en Android generado automáticamente desde `${{ github.sha }}`.

            Descargá `DulceVictoria-Agenda.apk` desde los archivos adjuntos abajo e instalalo en tu teléfono Android.
          files: DulceVictoria-Agenda.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
